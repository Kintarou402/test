<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VJ Motion</title><style>body{background:#111;color:#eee;font:15px system-ui;margin:0;padding:16px}main{max-width:850px;margin:auto}canvas{width:100%;aspect-ratio:16/9;background:black;border:1px solid #555}button,input,select{font:inherit;padding:9px;margin:5px 4px 8px 0}button{border:0;border-radius:7px}label{display:block;margin-top:10px}small{color:#aaa}</style></head><body><main><h2>VJ Motion Generator</h2><canvas id="view" width="1920" height="1080"></canvas><div><button id="toggle">停止</button><button id="next">次のパターン</button><button id="full">全画面</button></div><label>パターン <select id="style"><option value="random">ランダム</option><option value="rings">同心円</option><option value="waves">波線</option><option value="grid">グリッド</option><option value="rays">放射線</option><option value="shapes">図形</option></select></label><label>BPM <input id="bpm" type="number" min="30" max="300" value="120"></label><label>動きの速さ <input id="speed" type="range" min="0" max="3" step="0.1" value="1"></label><label><input id="auto" type="checkbox" checked> 1拍ごとにパターン切替</label><small>Safariで動作。図形の種類とパラメータを保持して動かす方式です（AI推論は行いません）。</small></main><script>
const c=document.querySelector('#view'),g=c.getContext('2d'),W=1920,H=1080,styles=['rings','waves','grid','rays','shapes'];let type='rings',params={},running=true,t=0,last=0,beat=0;const $=s=>document.querySelector(s),r=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(r(0,a.length))];function reset(){type=$('#style').value==='random'?pick(styles):$('#style').value;params={cx:r(300,1600),cy:r(200,850),step:r(28,85),count:Math.floor(r(15,65)),phase:r(0,6.28),reverse:Math.random()<.5,amp:r(20,110),freq:r(.003,.011),shapes:Array.from({length:45},()=>({x:r(0,W),y:r(0,H),s:r(25,230),rot:r(0,6.28),v:r(-1,1),circle:Math.random()<.5}))}}function render(){let p=params,fg=p.reverse?'#000':'#fff';g.fillStyle=p.reverse?'#fff':'#000';g.fillRect(0,0,W,H);g.strokeStyle=fg;g.fillStyle=fg;let z=t*Number($('#speed').value);if(type==='rings'){g.lineWidth=9;for(let i=0;i<55;i++){let rad=((i*p.step+z*70)%2200)+5;g.beginPath();g.arc(p.cx,p.cy,rad,0,Math.PI*2);g.stroke()}}if(type==='waves'){g.lineWidth=6;for(let y=-100;y<H+120;y+=p.step/2){g.beginPath();for(let x=0;x<=W;x+=12){let yy=y+Math.sin(x*p.freq+z*2+y*.012+p.phase)*p.amp;x===0?g.moveTo(x,yy):g.lineTo(x,yy)}g.stroke()}}if(type==='grid'){let s=p.step*1.6;for(let y=-s;y<H+s;y+=s)for(let x=-s;x<W+s;x+=s){let v=(Math.sin(z*2+x*.009+y*.01)+1)/2;g.save();g.translate(x+s/2,y+s/2);g.rotate(z*.4+v);g.fillRect(-s*v*.4,-s*v*.4,s*v*.8,s*v*.8);g.restore()}}if(type==='rays'){let n=p.count;for(let i=0;i<n;i++){let a=i*2*Math.PI/n+z*.45+p.phase,b=a+Math.PI/n*.8;g.beginPath();g.moveTo(p.cx,p.cy);g.lineTo(p.cx+Math.cos(a)*3000,p.cy+Math.sin(a)*3000);g.lineTo(p.cx+Math.cos(b)*3000,p.cy+Math.sin(b)*3000);g.fill()}}if(type==='shapes'){for(let s of p.shapes){g.save();g.translate(s.x+Math.sin(z+s.rot)*40,s.y+Math.cos(z*.8+s.rot)*40);g.rotate(s.rot+z*s.v*.5);if(s.circle){g.beginPath();g.arc(0,0,s.s/2,0,Math.PI*2);g.fill()}else g.fillRect(-s.s/2,-s.s/2,s.s,s.s);g.restore()}}}function frame(ms){if(!last)last=ms;let dt=Math.min((ms-last)/1000,.1);last=ms;if(running){t+=dt;beat+=dt;let sec=60/Math.max(30,Number($('#bpm').value)||120);if($('#auto').checked&&beat>=sec){beat%=sec;reset()}}render();requestAnimationFrame(frame)}$('#toggle').onclick=()=>{running=!running;$('#toggle').textContent=running?'停止':'再生'};$('#next').onclick=()=>{reset();beat=0};$('#style').onchange=reset;$('#full').onclick=()=>{if(c.requestFullscreen)c.requestFullscreen();else alert('iPhone SafariではCanvasの全画面表示に制限があります。Macで利用してください。')};reset();requestAnimationFrame(frame);
</script></body></html>
