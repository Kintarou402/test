<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VJ Monochrome Generator</title><style>body{margin:0;background:#101010;color:white;font-family:system-ui,sans-serif;padding:18px}main{max-width:800px;margin:auto}canvas{width:100%;aspect-ratio:16/9;background:black;border:1px solid #555}button,select,input{font:inherit;padding:10px;border-radius:8px}button{background:#eee;border:0;margin:5px 4px 5px 0}label{display:block;margin:14px 0 5px}small{color:#aaa}#status{min-height:1.5em}</style></head><body><main><h2>VJ Monochrome Generator</h2><canvas id="c" width="1920" height="1080"></canvas><label>デザイン</label><select id="mode"><option value="random">ランダム（5種類）</option><option value="rings">同心円</option><option value="geometry">幾何学</option><option value="waves">波線</option><option value="grid">グリッド</option><option value="rays">放射線</option></select><label>生成枚数</label><input id="count" type="number" value="20" min="1" max="200"><div><button id="preview">新しくプレビュー</button><button id="download">PNGを1枚保存</button><button id="batch">まとめてZIP保存</button></div><p id="status"></p><small>出力：1920×1080 PNG。SafariではZIP保存後に「ファイル」アプリのダウンロードを確認。</small></main><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),W=1920,H=1080;const $=id=>document.getElementById(id);const types=['rings','geometry','waves','grid','rays'];let current='';function rand(a,b){return a+Math.random()*(b-a)}function ri(a,b){return Math.floor(rand(a,b))}function choice(a){return a[ri(0,a.length)]}function fill(color){ctx.fillStyle=color;ctx.fillRect(0,0,W,H)}function line(x,y,x2,y2,w=3,color='#fff'){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=w;ctx.stroke()}function draw(){let mode=$('mode').value;current=mode==='random'?choice(types):mode;let inv=Math.random()<.5;fill(inv?'#fff':'#000');let fg=inv?'#000':'#fff';ctx.strokeStyle=fg;ctx.fillStyle=fg;const cx=rand(W*.25,W*.75),cy=rand(H*.2,H*.8);if(current==='rings'){let gap=rand(14,55),r=rand(10,100);ctx.lineWidth=rand(3,15);for(let i=0;i<65;i++,r+=gap){ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke()}}else if(current==='geometry'){for(let i=0,n=ri(25,110);i<n;i++){let x=rand(-100,W),y=rand(-100,H),s=rand(15,320);ctx.save();ctx.translate(x,y);ctx.rotate(rand(0,Math.PI));if(Math.random()<.5){ctx.fillRect(-s/2,-s/2,s,s*rand(.1,1))}else{ctx.beginPath();ctx.arc(0,0,s/2,0,Math.PI*2);Math.random()<.5?ctx.fill():ctx.stroke()}ctx.restore()}}else if(current==='waves'){let amp=rand(15,150),freq=rand(.002,.014),step=rand(12,45),phase=rand(0,6.28);ctx.lineWidth=rand(2,8);for(let y=-150;y<H+150;y+=step){ctx.beginPath();for(let x=0;x<=W;x+=8){let yy=y+Math.sin(x*freq+phase+y*.006)*amp;x===0?ctx.moveTo(x,yy):ctx.lineTo(x,yy)}ctx.stroke()}}else if(current==='grid'){let cell=ri(35,140),offset=ri(0,cell);for(let y=-cell;y<H+cell;y+=cell)for(let x=-cell;x<W+cell;x+=cell){if(Math.random()<.55){if(Math.random()<.4){ctx.beginPath();ctx.arc(x+cell/2,y+cell/2,cell*rand(.12,.49),0,Math.PI*2);ctx.fill()}else ctx.fillRect(x+offset,y+offset,cell-offset,cell-offset)}}}else if(current==='rays'){let n=ri(35,180),shift=rand(0,Math.PI*2),inner=rand(0,180);for(let i=0;i<n;i++){let a=i*Math.PI*2/n+shift,b=a+rand(.005,.035);ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*inner,cy+Math.sin(a)*inner);ctx.lineTo(cx+Math.cos(a)*3000,cy+Math.sin(a)*3000);ctx.lineTo(cx+Math.cos(b)*3000,cy+Math.sin(b)*3000);ctx.closePath();ctx.fill()}}return current}function blob(){return new Promise(resolve=>c.toBlob(resolve,'image/png'))}function save(b,name){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),30000)}$('preview').onclick=()=>{draw();$('status').textContent='プレビュー：'+current};$('download').onclick=async()=>{save(await blob(),'vj_'+current+'.png')};$('batch').onclick=async()=>{if(!window.JSZip){$('status').textContent='ZIPライブラリを読み込めません。インターネット接続を確認してください。';return}let n=Math.max(1,Math.min(200,parseInt($('count').value)||20));$('batch').disabled=true;let zip=new JSZip();try{for(let i=0;i<n;i++){let kind=draw(),b=await blob();if(!b)throw Error('PNG変換に失敗');zip.file(String(i+1).padStart(3,'0')+'_'+kind+'.png',b);$('status').textContent=`生成中 ${i+1}/${n}`;await new Promise(r=>setTimeout(r,0))}let output=await zip.generateAsync({type:'blob',compression:'STORE'},meta=>{$('status').textContent=`ZIP作成 ${Math.round(meta.percent)}%`});save(output,'vj_monochrome_'+n+'.zip');$('status').textContent=`完了：${n}枚をZIPに保存しました`}catch(e){$('status').textContent='エラー：'+e.message}finally{$('batch').disabled=false}};draw();
</script></body></html>
