<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VJ LIVE OUTPUT</title><style>*{box-sizing:border-box}html,body{margin:0;background:#000;overflow:hidden;width:100%;height:100%}canvas{display:block;width:100vw;height:100vh;object-fit:contain;background:#000}#help{position:fixed;bottom:12px;left:12px;background:#111c;color:#fff;font:12px system-ui;padding:8px;border-radius:5px;pointer-events:none;opacity:0;transition:opacity .3s}body:hover #help{opacity:.75}</style></head><body><canvas id="c" width="1920" height="1080"></canvas><div id="help">F: 全画面 / Space: 停止・再開 / ← →: BPM変更 / クリック: 次のパターン</div><script>
const c=document.querySelector('canvas'),g=c.getContext('2d',{alpha:false}),W=1920,H=1080;let bpm=120,playing=true,style=0,start=performance.now(),pausedAt=0,lastBeat=-1,seed=0;const TAU=Math.PI*2;function rand(n){let x=Math.sin(n*127.1+seed*311.7)*43758.5453;return x-Math.floor(x)}function next(){seed++;style=Math.floor(rand(10)*5);lastBeat=-1}function draw(now){requestAnimationFrame(draw);if(!playing)return;let beat=Math.floor((now-start)/(60000/bpm));if(beat!==lastBeat){lastBeat=beat;seed++;style=Math.floor(rand(7)*5)}let t=(now-start)/1000;g.fillStyle='#000';g.fillRect(0,0,W,H);g.save();g.strokeStyle='#fff';g.fillStyle='#fff';const cx=W*(.35+.3*rand(3)),cy=H*(.3+.4*rand(4));if(style===0){let spacing=18+rand(5)*48;g.lineWidth=2+rand(6)*11;for(let i=0;i<90;i++){let r=i*spacing+((t*75)%spacing);g.beginPath();g.arc(cx,cy,r,0,TAU);g.stroke()}}else if(style===1){let n=30+Math.floor(rand(9)*55);for(let i=0;i<n;i++){let x=rand(i*4+1)*W,y=rand(i*4+2)*H,s=20+rand(i*4+3)*250,a=t*(rand(i*4+4)-.5)*1.5;g.save();g.translate(x+Math.sin(t+i)*25,y+Math.cos(t*.7+i)*25);g.rotate(a);if(i%3===0){g.beginPath();g.arc(0,0,s/2,0,TAU);g.stroke()}else if(i%3===1)g.fillRect(-s/2,-s/2,s,s*.35);else{g.beginPath();g.moveTo(0,-s/2);g.lineTo(s/2,s/2);g.lineTo(-s/2,s/2);g.closePath();g.fill()}g.restore()}}else if(style===2){let gap=15+rand(5)*35,amp=40+rand(6)*150;g.lineWidth=2+rand(7)*7;for(let y=-amp;y<H+amp;y+=gap){g.beginPath();for(let x=0;x<=W;x+=12){let yy=y+Math.sin(x*.006+t*2+y*.008)*amp;x?g.lineTo(x,yy):g.moveTo(x,yy)}g.stroke()}}else if(style===3){let cell=40+Math.floor(rand(5)*100),offset=(t*40)%cell;for(let y=-cell;y<H+cell;y+=cell)for(let x=-cell;x<W+cell;x+=cell){let xx=x+offset,yy=y+offset;if((Math.floor(x/cell)+Math.floor(y/cell))%2===0){if(rand(x+y)<.4){g.beginPath();g.arc(xx+cell/2,yy+cell/2,cell*.43,0,TAU);g.fill()}else g.fillRect(xx,yy,cell,cell)}}}else{let n=24+Math.floor(rand(5)*90);g.save();g.translate(cx,cy);g.rotate(t*.35);for(let i=0;i<n;i++){let a=i*TAU/n,b=a+TAU/n*(.3+.4*rand(i));g.beginPath();g.moveTo(0,0);g.lineTo(Math.cos(a)*3000,Math.sin(a)*3000);g.lineTo(Math.cos(b)*3000,Math.sin(b)*3000);g.closePath();g.fill()}g.restore()}g.restore()};requestAnimationFrame(draw);
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(playing){pausedAt=performance.now();playing=false}else{start+=performance.now()-pausedAt;playing=true}}else if(e.key==='f'||e.key==='F'){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}else if(e.key==='ArrowUp'||e.key==='ArrowRight'){bpm=Math.min(240,bpm+5);start=performance.now();lastBeat=-1}else if(e.key==='ArrowDown'||e.key==='ArrowLeft'){bpm=Math.max(40,bpm-5);start=performance.now();lastBeat=-1}});c.addEventListener('click',()=>{start=performance.now();next()});
</script></body></html>
