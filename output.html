<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VJ LIVE OUTPUT</title><style>*{box-sizing:border-box}html,body{margin:0;background:#000;overflow:hidden;width:100%;height:100%}canvas{display:block;width:100vw;height:100vh;object-fit:contain;background:#000}#help{position:fixed;bottom:12px;left:12px;background:#111c;color:#fff;font:12px system-ui;padding:8px;border-radius:5px;pointer-events:none;opacity:0;transition:opacity .3s}body:hover #help{opacity:.75}#panel{position:fixed;top:12px;right:12px;width:min(330px,calc(100vw - 24px));background:#111e;color:#fff;padding:16px;border:1px solid #555;border-radius:12px;font:14px system-ui;z-index:5;backdrop-filter:blur(12px)}#panel.hidden{display:none}#panel h2{font-size:16px;margin:0 0 12px}#panel input{width:100%;accent-color:white}#panel button{background:#fff;color:#111;border:0;border-radius:7px;padding:10px 12px;font-weight:700;touch-action:manipulation}#panel .buttons{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}#panel .buttons button{flex:1}#bpmText{font-size:30px;font-weight:750;font-variant-numeric:tabular-nums}#panel p{color:#bbb;font-size:12px;line-height:1.5}#toggle{position:fixed;top:12px;left:12px;z-index:6;background:#111b;color:#fff;border:1px solid #777;border-radius:8px;padding:8px 12px;font:12px system-ui;cursor:pointer}body.clean #toggle{display:none}body.clean #help{display:none}body.clean #panel{display:none}body.clean{cursor:none}@media(max-width:600px){#panel{top:48px}} </style></head><body><canvas id="c" width="1920" height="1080"></canvas><button id="toggle" type="button">操作パネル (H)</button><section id="panel"><h2>BPM / LIVE CONTROL</h2><div><span id="bpmText">120</span> BPM</div><input id="bpmSlider" aria-label="BPM" type="range" min="40" max="240" step="1" value="120"><div class="buttons"><button id="minus" type="button">−1</button><button id="plus" type="button">+1</button><button id="tap" type="button">TAP BPM</button></div><div class="buttons"><button id="pause" type="button">一時停止</button><button id="next" type="button">次の図形</button></div><div class="buttons"><button id="full" type="button">全画面</button><button id="clean" type="button">映像のみ (H)</button></div><p id="tapInfo">曲に合わせて3〜5回タップ。3秒空くと計測リセット。</p><p>H: パネル表示/非表示　T: TAP　F: 全画面　Space: 再生/停止　←→: BPM ±1</p></section><div id="help">F: 全画面 / Space: 停止・再開 / ← →: BPM変更 / クリック: 次のパターン</div><script>
const c=document.querySelector('canvas'),g=c.getContext('2d',{alpha:false}),W=1920,H=1080;let bpm=120,playing=true,style=0,start=performance.now(),pausedAt=0,lastBeat=-1,seed=0;const TAU=Math.PI*2;function rand(n){let x=Math.sin(n*127.1+seed*311.7)*43758.5453;return x-Math.floor(x)}function next(){seed++;style=Math.floor(rand(10)*5);lastBeat=-1}function draw(now){requestAnimationFrame(draw);if(!playing)return;let beat=Math.floor((now-start)/(60000/bpm));if(beat!==lastBeat){lastBeat=beat;seed++;style=Math.floor(rand(7)*5)}let t=(now-start)/1000;g.fillStyle='#000';g.fillRect(0,0,W,H);g.save();g.strokeStyle='#fff';g.fillStyle='#fff';const cx=W*(.35+.3*rand(3)),cy=H*(.3+.4*rand(4));if(style===0){let spacing=18+rand(5)*48;g.lineWidth=2+rand(6)*11;for(let i=0;i<90;i++){let r=i*spacing+((t*75)%spacing);g.beginPath();g.arc(cx,cy,r,0,TAU);g.stroke()}}else if(style===1){let n=30+Math.floor(rand(9)*55);for(let i=0;i<n;i++){let x=rand(i*4+1)*W,y=rand(i*4+2)*H,s=20+rand(i*4+3)*250,a=t*(rand(i*4+4)-.5)*1.5;g.save();g.translate(x+Math.sin(t+i)*25,y+Math.cos(t*.7+i)*25);g.rotate(a);if(i%3===0){g.beginPath();g.arc(0,0,s/2,0,TAU);g.stroke()}else if(i%3===1)g.fillRect(-s/2,-s/2,s,s*.35);else{g.beginPath();g.moveTo(0,-s/2);g.lineTo(s/2,s/2);g.lineTo(-s/2,s/2);g.closePath();g.fill()}g.restore()}}else if(style===2){let gap=15+rand(5)*35,amp=40+rand(6)*150;g.lineWidth=2+rand(7)*7;for(let y=-amp;y<H+amp;y+=gap){g.beginPath();for(let x=0;x<=W;x+=12){let yy=y+Math.sin(x*.006+t*2+y*.008)*amp;x?g.lineTo(x,yy):g.moveTo(x,yy)}g.stroke()}}else if(style===3){let cell=40+Math.floor(rand(5)*100),offset=(t*40)%cell;for(let y=-cell;y<H+cell;y+=cell)for(let x=-cell;x<W+cell;x+=cell){let xx=x+offset,yy=y+offset;if((Math.floor(x/cell)+Math.floor(y/cell))%2===0){if(rand(x+y)<.4){g.beginPath();g.arc(xx+cell/2,yy+cell/2,cell*.43,0,TAU);g.fill()}else g.fillRect(xx,yy,cell,cell)}}}else{let n=24+Math.floor(rand(5)*90);g.save();g.translate(cx,cy);g.rotate(t*.35);for(let i=0;i<n;i++){let a=i*TAU/n,b=a+TAU/n*(.3+.4*rand(i));g.beginPath();g.moveTo(0,0);g.lineTo(Math.cos(a)*3000,Math.sin(a)*3000);g.lineTo(Math.cos(b)*3000,Math.sin(b)*3000);g.closePath();g.fill()}g.restore()}g.restore()};requestAnimationFrame(draw);
const slider=document.getElementById('bpmSlider'),bpmText=document.getElementById('bpmText'),tapInfo=document.getElementById('tapInfo');let taps=[];
function setBpm(v){bpm=Math.max(40,Math.min(240,Math.round(Number(v)||120)));slider.value=bpm;bpmText.textContent=bpm;start=performance.now();lastBeat=-1}
function tapBpm(){const now=performance.now();if(taps.length&&now-taps[taps.length-1]>3000)taps=[];taps.push(now);taps=taps.slice(-6);if(taps.length>=2){let intervals=taps.slice(1).map((t,i)=>t-taps[i]);let avg=intervals.reduce((a,b)=>a+b,0)/intervals.length;let estimate=60000/avg;if(estimate>=40&&estimate<=240)setBpm(estimate)}tapInfo.textContent=`TAP: ${taps.length}回 / ${taps.length>1?bpm+' BPM':'あと数回タップ'}`}
function pause(){if(playing){pausedAt=performance.now();playing=false}else{start+=performance.now()-pausedAt;playing=true}document.getElementById('pause').textContent=playing?'一時停止':'再生'}
function togglePanel(){document.body.classList.toggle('clean')}
slider.addEventListener('input',e=>setBpm(e.target.value));document.getElementById('minus').onclick=()=>setBpm(bpm-1);document.getElementById('plus').onclick=()=>setBpm(bpm+1);document.getElementById('tap').onclick=tapBpm;document.getElementById('pause').onclick=pause;document.getElementById('next').onclick=()=>{start=performance.now();next()};document.getElementById('clean').onclick=togglePanel;document.getElementById('toggle').onclick=togglePanel;document.getElementById('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
document.addEventListener('keydown',e=>{if(['INPUT','BUTTON'].includes(document.activeElement?.tagName)&&e.code==='Space')return;if(e.key==='h'||e.key==='H'){togglePanel();return}if(e.key==='t'||e.key==='T'){tapBpm();return}if(e.code==='Space'){e.preventDefault();pause()}else if(e.key==='f'||e.key==='F'){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}else if(e.key==='ArrowUp'||e.key==='ArrowRight'){setBpm(bpm+1)}else if(e.key==='ArrowDown'||e.key==='ArrowLeft'){setBpm(bpm-1)}});c.addEventListener('click',()=>{start=performance.now();next()});
</script></body></html>
